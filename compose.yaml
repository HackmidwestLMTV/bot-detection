services:
  app:
    build: .
    env_file: .env
    restart: unless-stopped
    # --workers 1: the SSE broadcaster and rate limits live in memory
    command: uvicorn web.app:app --host 0.0.0.0 --port 8000 --workers 1
    ports: ["8000:8000"]       # fallback http://IP:8000 if HTTPS isn't up yet
  worker:                      # Person 2's agent worker; enabled from 11 PM (deploy-time integration)
    build: .
    env_file: .env
    environment: { API_BASE: "http://app:8000" }
    command: python -m engine.worker
    restart: unless-stopped
    profiles: ["engine"]
  caddy:
    image: caddy:2
    env_file: .env               # DOMAIN, optional ACME_CA
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile", "caddy_data:/data"]
    depends_on: [app]
  db:                          # local dev only: `docker compose --profile local up -d db`
    image: postgres:17
    environment: { POSTGRES_PASSWORD: dev, POSTGRES_DB: followit }
    ports: ["5432:5432"]
    profiles: ["local"]
volumes: { caddy_data: {} }
